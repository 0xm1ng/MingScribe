name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  test:
    name: test (node${{ matrix.node }} / ${{ matrix.os }} / tz=${{ matrix.tz }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22]
        tz: [UTC]
        include:
          # 额外跑一个非 UTC 时区。formatDateTime 按本地时区渲染，
          # 只跑 UTC 会把「写死东八区期望值」这类断言藏起来（2026-09-15 漏过一次）。
          - os: ubuntu-latest
            node: 22
            tz: America/New_York

    steps:
      - uses: actions/checkout@v4

      # 网页版是零第三方依赖的：测试只用 Node 内置 test runner，
      # 所以这里刻意不跑 npm install —— CI 全程无网络依赖、无 lockfile 风险。
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Show runtime
        shell: bash
        env:
          TZ: ${{ matrix.tz }}
        run: |
          node --version
          node -p "process.platform + ' ' + process.arch + ' ' + Intl.DateTimeFormat().resolvedOptions().timeZone"

      # 也刻意**不经 npm**：npm script 在三个平台上交给不同 shell，对 glob 的展开行为不一致；
      # 直接传 glob 字面量则统一由 Node 自己展开（Node 21+ 支持）。
      - name: Run tests
        shell: bash
        env:
          TZ: ${{ matrix.tz }}
        run: |
          set +e
          node --test "tests/*.test.js" > test.log 2>&1
          code=$?
          cat test.log
          if [ "$code" -ne 0 ]; then
            # 把第一条失败用例连同断言信息经 annotation 抛出，便于在没有仓库权限时定位
            msg=$(awk '/^not ok/ {p=1} p {printf "%s%%0A", $0; if (++n >= 10) exit}' test.log)
            echo "::error::exited $code · $(node --version) · ${{ matrix.os }} · TZ=${{ matrix.tz }}%0A$msg"
          fi
          exit $code

  # 标签守卫：vX.Y.Z 标签必须与四处版本号完全一致。
  # 只在推标签时跑 —— 目的是让「标签与代码对不上」这类事故在推上去的一刻就暴露，
  # 而不是等到用户装完发现 About 里的版本号和 Release 名不一样。
  tag-version:
    name: tag matches version
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check tag === version fields
        shell: bash
        run: node tools/check_tag_version.js
